<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MindAR Test</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      /* Kamera-Video auf volle Größe zwingen */
      video {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
      }

      /* a-scene auch fullscreen */
      a-scene {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="
        imageTargetSrc: ./assets/targets.mind;
        uiLoading: no;
        uiScanning: no;
        uiError: yes;
        autoStart: true;
      "
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <!-- Assets -->
      <a-assets>
        <a-asset-item id="phoneModel" src="./assets/Phone.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Tracking Target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Rote Test-Box (sehr gut sichtbar) -->
        <a-box 
          color="#ff0000" 
          position="0 0 0" 
          scale="0.4 0.4 0.4"
        ></a-box>

        <!-- Phone-Modell (kannst du später aktivieren) -->
        <!--
        <a-gltf-model 
          src="#phoneModel"
          position="0 0 0.1"
          scale="0.4 0.4 0.4"
          rotation="0 0 0"
        ></a-gltf-model>
        -->
      </a-entity>
    </a-scene>

    <script>
      // Einfache Fehlermeldung in die Konsole
      window.addEventListener('load', () => {
        console.log("Seite geladen – prüfe jetzt die Browser-Konsole auf Fehler (besonders 404 bei der .mind Datei)");
      });
    </script>
  </body>
</html>
