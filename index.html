<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>MindAR Portfolio Test</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- MindAR Image Tracking + A-Frame Integration -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      mindar-image="imageTargetSrc: ./assets/imageMarker.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <!-- Assets -->
      <a-assets>
        <a-asset-item id="phoneModel" src="./assets/Phone.glb"></a-asset-item>
      </a-assets>

      <!-- Kamera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Tracking-Target (Index 0 = erstes Bild in der .mind-Datei) -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Test: Rote Box in der Mitte (kannst du später entfernen) -->
        <a-box 
          color="red" 
          position="0 0 0" 
          scale="0.2 0.2 0.2"
        ></a-box>

        <!-- Dein Phone-Modell -->
        <a-gltf-model 
          src="#phoneModel"
          position="0 0 0.1"
          scale="0.5 0.5 0.5"
          rotation="0 0 0"
        ></a-gltf-model>

      </a-entity>
    </a-scene>
  </body>
</html>
