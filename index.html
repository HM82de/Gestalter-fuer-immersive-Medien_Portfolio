<!-- import aframe and then ar.js with image tracking / location based features -->
<script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<!-- style for the loader -->
<style>
  .arjs-loader {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0, 0, 0, 0.8);
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .arjs-loader div {
    text-align: center;
    font-size: 1.25em;
    color: white;
  }
</style>
<body style="margin : 0px; overflow: hidden;">
  <!-- minimal loader shown until image descriptors are loaded. Loading may take a while according to the device computational power -->
  <div class="arjs-loader">
    <div>
      Willkommen zu meinem Portfolio!<br>
      Content wird geladen.<br>
      version 1.9
    </div>
  </div>
  <!-- a-frame scene -->
  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam;debugUIEnabled: true;"
  >
    <!-- a-nft is the anchor that defines an Image Tracking entity -->
    <a-nft
      type="nft"
      url="https://hm82de.github.io/Gestalter-fuer-immersive-Medien_Portfolio/assets/imageMarker_2"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5"
    >
      <!-- Test-Box zum Prüfen, ob Tracking funktioniert -->
      <a-box 
        color="red" 
        scale="80 80 80" 
        position="0 0 0"
      ></a-box>

      <!-- Phone-Modell vorerst auskommentiert – später wieder aktivieren -->
      <!--
      <a-entity
        gltf-model="assets/Phone.glb"
        scale="0.1 0.1 0.1"
        position="0 50 0"
      ></a-entity>
      -->
    </a-nft>

    <!-- static camera that moves according to the device movements -->
    <a-entity camera></a-entity>
  </a-scene>

  <!-- hides the loading overlay once the NFT image descriptors have fully loaded -->
  <script>
    window.addEventListener("arjs-nft-loaded", (event) => {
      document.querySelector(".arjs-loader").style.display = "none";
    });
  </script>
</body>
