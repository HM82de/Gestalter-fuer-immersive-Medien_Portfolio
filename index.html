<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR-Visitenkarte von Heiman Mustafa</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Status-Anzeige oben zentriert */
      #status {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        background: rgba(0,0,0,0.75);
        padding: 10px 18px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        z-index: 9999;
        border-radius: 8px;
        text-align: center;
        max-width: 90%;
        white-space: nowrap;
      }

      /* Kamera-Video sichtbar und fullscreen */
      video {
        display: block !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
        opacity: 1 !important;
      }

      /* a-scene darüber */
      a-scene {
        position: absolute !important;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
      }

      /* Canvas transparent, damit Video durchscheint */
      .a-canvas {
        background: transparent !important;
      }
    </style>
  </head>

  <body>
    <div id="status">Starte AR-Visitenkarte...</div>

    <a-scene
      mindar-image="imageTargetSrc: https://hm82de.github.io/Gestalter-fuer-immersive-Medien_Portfolio/assets/targets.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <!-- Assets -->
      <a-assets>
        <a-asset-item id="phoneModel" src="https://hm82de.github.io/Gestalter-fuer-immersive-Medien_Portfolio/assets/Phone.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- Rote Test-Box (links) -->
        <a-box 
          color="#ff2222" 
          position="-0.35 0 0" 
          scale="0.35 0.35 0.35">
        </a-box>

        <!-- Phone-Modell (rechts neben der Box) -->
        <a-gltf-model 
          src="#phoneModel"
          position="0.4 0 0.05"
          scale="0.45 0.45 0.45"
          rotation="0 0 0">
        </a-gltf-model>

      </a-entity>
    </a-scene>

    <script>
      const statusEl = document.getElementById('status');
      const sceneEl = document.querySelector('a-scene');

      // Status-Updates
      sceneEl.addEventListener('loaded', () => {
        statusEl.textContent = 'AR-Visitenkarte geladen – Kamera auf Visitenkarte richten';
      });

      // Target gefunden / verloren
      const target = document.querySelector('[mindar-image-target]');
      if (target) {
        target.addEventListener('targetFound', () => {
          statusEl.textContent = '✓ Visitenkarte von Heiman Mustafa erkannt';
          statusEl.style.background = 'rgba(0,140,0,0.85)';
        });
        target.addEventListener('targetLost', () => {
          statusEl.textContent = 'Kamera auf Visitenkarte richten';
          statusEl.style.background = 'rgba(0,0,0,0.75)';
        });
      }

      // Fehler abfangen
      window.addEventListener('error', (e) => {
        statusEl.textContent = 'Fehler: ' + (e.message || 'Unbekannt');
        statusEl.style.background = 'darkred';
      });

      // Video-Element nachträglich sichtbar machen (Fallback)
      setTimeout(() => {
        const video = document.querySelector('video');
        if (video) {
          video.style.display = 'block';
          video.style.opacity = '1';
          video.style.zIndex = '1';
        }
      }, 1500);
    </script>
  </body>
</html>
