<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR-Visitenkarte von Heiman Mustafa</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  /* Status-Anzeige */
  #status {
    position: fixed;
    top: 12px;
    left: 12px;
    color: white;
    background: rgba(0,0,0,0.75);
    padding: 10px 14px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    z-index: 9999;
    border-radius: 8px;
  }

  /* === WICHTIG: Kamera-Video sichtbar machen === */
  video {
    display: block !important;
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    z-index: 1 !important;
  }

  /* a-scene Canvas darüber legen */
  a-scene {
    position: absolute !important;
    top: 0;
    left: 0;
    width: 100% !important;
    height: 100% !important;
    z-index: 2 !important;
  }

  /* Canvas transparent machen, damit das Video durchscheint */
  .a-canvas {
    background: transparent !important;
  }
</style>
  </head>
  <body>

    <div id="status">Starte MindAR...</div>

    <a-scene
      mindar-image="imageTargetSrc: https://hm82de.github.io/Gestalter-fuer-immersive-Medien_Portfolio/assets/targets.mind; autoStart: true;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- Große rote Test-Box -->
        <a-box 
          color="#ff2222" 
          position="0 0 0" 
          scale="0.45 0.45 0.45">
        </a-box>
      </a-entity>
    </a-scene>

    <script>
      const statusEl = document.getElementById('status');

      // Status-Updates
      const sceneEl = document.querySelector('a-scene');

      sceneEl.addEventListener('loaded', () => {
        statusEl.textContent = 'Szene geladen – Kamera sollte starten...';
      });

      // Target gefunden / verloren
      const target = document.querySelector('[mindar-image-target]');
      if (target) {
        target.addEventListener('targetFound', () => {
          statusEl.textContent = '✓ Target gefunden!';
          statusEl.style.background = 'rgba(0,140,0,0.85)';
        });
        target.addEventListener('targetLost', () => {
          statusEl.textContent = 'Target verloren';
          statusEl.style.background = 'rgba(0,0,0,0.75)';
        });
      }

      // Fehler abfangen
      window.addEventListener('error', (e) => {
        statusEl.textContent = 'Fehler: ' + (e.message || 'Unbekannt');
        statusEl.style.background = 'darkred';
      });
    </script>
    <script>
  // Warte kurz und erzwinge die Video-Sichtbarkeit
  setTimeout(() => {
    const video = document.querySelector('video');
    if (video) {
      video.style.display = 'block';
      video.style.opacity = '1';
      video.style.zIndex = '1';
      console.log('Video-Element gefunden und sichtbar gemacht');
    } else {
      console.warn('Kein Video-Element gefunden');
    }
  }, 1500);
</script>
    
  </body>
</html>
